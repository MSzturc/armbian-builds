name: 'Fix BOOT partition'
author: 'Stefan Dej'
description: 'Make the FAT boot partition Windows-mountable: type 0c (W95 FAT32 LBA) and the MBR active flag'

runs:
  using: 'composite'
  steps:
    - name: Show partition table before
      id: check-disk
      shell: bash
      working-directory: "./build/output/images/"
      run: |
        echo "::group::Partition table of generated image"
        fdisk -l *.img
        echo "::endgroup::"
        echo "::group::Checking disk label type"
        DISK_LABEL=$(fdisk -l *.img | grep "Disklabel type:" | awk '{print $3}')
        echo "Disk label type: ${DISK_LABEL}"
        echo "::endgroup::"
        echo "disk_label=${DISK_LABEL}" >> $GITHUB_OUTPUT

    - name: Find FAT boot partition
      id: get-partition
      if: steps.check-disk.outputs.disk_label == 'dos'
      shell: bash
      working-directory: "./build/output/images/"
      run: |
        echo "::group::Finding the FAT boot partition"
        # Armbian types the FAT boot partition 0xea; match that or an already-fixed 0x0c so the active flag below is applied either way
        PARTITION_INDEX=$(fdisk -l *.img | grep -iE '(ea Linux extended|c W95 FAT32)' | head -1 | awk '{print $1}' | grep -o '[0-9]*$' || echo "")
        if [ -z "${PARTITION_INDEX}" ]; then
          echo "No FAT boot partition found"
        fi
        echo "Found partition index: ${PARTITION_INDEX}"
        echo "::endgroup::"
        echo "partition_index=${PARTITION_INDEX}" >> $GITHUB_OUTPUT

    - name: Set FAT32 (LBA) type and active flag
      if: steps.check-disk.outputs.disk_label == 'dos' && steps.get-partition.outputs.partition_index != ''
      shell: bash
      working-directory: "./build/output/images/"
      run: |
        echo "::group::Setting type 0c and active flag"
        IMAGE_FILE=$(ls *.img)
        INDEX="${{ steps.get-partition.outputs.partition_index }}"
        echo "Image file: ${IMAGE_FILE}, partition index: ${INDEX}"
        # 0c lets Windows recognise the FAT; the active flag makes Windows assign it a drive letter on removable media
        sfdisk --part-type "${IMAGE_FILE}" "${INDEX}" 0c
        sfdisk --activate "${IMAGE_FILE}" "${INDEX}"
        echo "::endgroup::"

    - name: Show updated partition table
      if: steps.check-disk.outputs.disk_label == 'dos' && steps.get-partition.outputs.partition_index != ''
      shell: bash
      working-directory: "./build/output/images/"
      run: |
        echo "::group::Updated partition table"
        fdisk -l *.img
        echo "::endgroup::"
